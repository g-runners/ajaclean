
<!DOCTYPE HTML>
<html lang="id">
<head>
    <title>AjaClean - Pilih Pengguna</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            background: #252735;
        }

        /* =========================
           BACKGROUND
        ========================= */

        #page-wrapper {
            min-height: 100vh;
            position: relative;

            background:
                linear-gradient(
                    135deg,
                    rgba(25, 25, 35, 0.65),
                    rgba(42, 32, 55, 0.55),
                    rgba(20, 25, 38, 0.72)
                ),
                url("images/banner.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* =========================
           BANNER
        ========================= */

        #banner {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }

        #banner .inner {
            width: 100%;
            max-width: 850px;
            position: relative;
            z-index: 1;
        }

        /* =========================
           JUDUL
        ========================= */

        #banner h2 {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 6px;
            text-transform: uppercase;
            display: inline-block;
            position: relative;
            padding: 20px 35px;
            margin-bottom: 25px;

            opacity: 0;
            transform: translateY(25px);
            animation: titleEnter 0.8s ease forwards;
        }

        #banner h2::before,
        #banner h2::after {
            content: "";
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.85);
            transform: scaleX(0);
            animation: lineEnter 0.8s ease forwards;
        }

        #banner h2::before {
            top: 0;
        }

        #banner h2::after {
            bottom: 0;
            animation-delay: 0.2s;
        }

        /* =========================
           DESKRIPSI
        ========================= */

        #banner p {
            font-size: 1rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 45px;

            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s ease 0.3s forwards;
        }

        /* =========================
           TOMBOL ROLE
        ========================= */

        .role-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 650px;
            margin: 0 auto;
        }

        .role-btn {
            min-height: 105px;
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;

            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 5px;

            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

            opacity: 0;
            transform: translateY(25px);

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        /* Animasi tombol bertahap */

        .role-btn:nth-child(1) {
            animation: fadeUp 0.7s ease 0.5s forwards;
        }

        .role-btn:nth-child(2) {
            animation: fadeUp 0.7s ease 0.65s forwards;
        }

        .role-btn:nth-child(3) {
            animation: fadeUp 0.7s ease 0.8s forwards;
        }

        .role-btn:nth-child(4) {
            animation: fadeUp 0.7s ease 0.95s forwards;
        }

        /* Efek Hover */

        .role-btn:hover {
            background: rgba(255, 255, 255, 0.23);
            border-color: #ffffff;
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .role-btn:active {
            transform: scale(0.97);
        }

        /* =========================
           ANIMASI
        ========================= */

        @keyframes titleEnter {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes lineEnter {
            from {
                transform: scaleX(0);
            }

            to {
                transform: scaleX(1);
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media screen and (max-width: 600px) {

            #banner {
                padding: 30px 20px;
            }

            #banner h2 {
                font-size: 2rem;
                letter-spacing: 4px;
                padding: 15px 25px;
            }

            #banner p {
                font-size: 0.9rem;
                margin-bottom: 30px;
            }

            .role-buttons {
                grid-template-columns: 1fr;
                gap: 15px;
                max-width: 350px;
            }

            .role-btn {
                min-height: 75px;
                font-size: 1rem;
            }
        }

        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }

    </style>
</head>

<body class="landing is-preload">

    <div id="page-wrapper">

        <!-- Banner -->
        <section id="banner">

            <div class="inner">

                <h2>AjaClean</h2>

                <p>
                    Sistem Informasi AjaClean<br>
                    Silakan pilih jenis pengguna untuk melanjutkan.
                </p>

                <!-- Pilihan Pengguna -->
                <div class="role-buttons">

                    <a href="kar.html" class="role-btn">
                        Karyawan
                    </a>

                    <a href="ad.html" class="role-btn">
                        Admin
                    </a>

                    <a href="cust.html" class="role-btn">
                        Customer
                    </a>

                    <a href="ow.html" class="role-btn">
                        Owner
                    </a>

                </div>

            </div>

        </section>

    </div>

</body>
</html>
